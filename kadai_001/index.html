<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="自己紹介と趣味を掲載するサイトです。">
    <title>MyProfile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Noto+Sans+JP&display=swap" rel="stylesheet">
  </head>

  <body>
    <header>
        <div id="home">
            <a href="index.html">My Profile</a>
        </div>

        <div id="nav">
          <a href="index.html#about">About</a>
          <a href="index.html#works">Works</a>
        </div>
    </header>

    <main>
      <article>

        <div id="camera">
          <img src="Figma/main.png">
        </div>

        <section id="about">
          <h1>About</h1>
          <div id="about-flex">
            <img id="about-photo" src="Figma/about.png" alt="顔写真">
            <div id="profile">
              <h2>Kazuki Asahina</h2>
              <ul>
                <li>25歳　長野県佐久市出身</li>
                <li>ソフトウェア業界でマーケティングに従事</li>
                <li>趣味はカメラ、愛機はCanon</li>
                <li>自然を撮影するのが好きで、海や山によく行く</li>
              </ul>
            </div>
          </div>
        </section>

        <section id="works">
          <h1>Works</h1>
          <div id="works-flex">
            <div class="photo">
              <img id="works-left" src="Figma/works1.png" alt="日本海の写真">
              <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した１枚</p>
            </div>

            <div class="photo">
              <img id="works-center" src="Figma/works2.png" alt="御嶽山の写真">
              <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
            </div>

            <div class="photo">
              <img id="works-right" src="Figma/works3.png" alt="京都の街並みの写真">
              <p>京都で撮影した、明け方の古き良き日本の町並み</p>
            </div>
          </div>
        </section>

      </article>

      <footer>
        <p id="copyright">&copy;MyProfile.All rights reserved.</p>
      </footer>

    </main>
  </body>
</html>
